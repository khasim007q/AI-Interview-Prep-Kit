services:
  - type: web
    name: ai-interview-prep-api
    env: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install --include=dev && npm run build:shared && npm run build -w @ai-interview-prep/api
    startCommand: npm run start -w @ai-interview-prep/api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash
      - key: SEARCH_PROVIDER
        value: serpapi
      - key: SERPAPI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ALLOW_LOCAL_FETCH
        value: "false"
